# Invites someone from home (1e, 1f): the number typed by hand, a relationship, Daveti gönder. The
# system share sheet opens; it is closed with back, and home shows the pending invite (1g).
# NAME, PHONE and RELATIONSHIP come from the orchestrator (no defaults: see sign-up.yaml).
appId: app.nuddle.debug
---
- extendedWaitUntil:
    visible:
      id: home.invite
    timeout: 30000
- tapOn:
    id: home.invite
- tapOn:
    id: invite.typeNumber
- tapOn:
    id: invite.name
- inputText: ${NAME}
- tapOn:
    id: invite.number
- inputText: ${PHONE}
- hideKeyboard
- tapOn:
    id: invite.relationship.${RELATIONSHIP}
- tapOn:
    id: invite.send
- extendedWaitUntil:
    notVisible:
      id: invite.screen
    timeout: 30000
- pressKey: back
- extendedWaitUntil:
    visible:
      id: home.pendingInvite
    timeout: 30000
