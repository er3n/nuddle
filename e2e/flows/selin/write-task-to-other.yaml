# Writes a task to Eren in the compose bar; the fixture extractor answers TEXT with a confident task
# to Eren, so it goes out directly: "Gönderildi" toast and the new row under "Senin yazdıkların" (4i).
# TEXT comes from the orchestrator (no default: see sign-up.yaml).
appId: app.nuddle.debug
---
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 30000
- tapOn:
    id: compose.input
- inputText: ${TEXT}
- tapOn:
    id: compose.send
- extendedWaitUntil:
    visible:
      id: home.sent
    timeout: 30000
- assertVisible:
    id: home.undo
