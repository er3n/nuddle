# Taps the element tagged ID once it is on screen. For the steps of the two-person set that are one tap
# (Şimdiden bitti, Ertele, Ben hallederim, Sonradan yaptım); the orchestrator checks both phones in between.
appId: app.nuddle.debug
---
- extendedWaitUntil:
    visible:
      id: ${ID}
    timeout: 30000
- tapOn:
    id: ${ID}
