# Bitti on the full screen poke of a photo task opened the camera (4d). The e2e flavor's camera "takes" the photo
# the orchestrator put on the phone; Gönder, and home shows the task waiting for Selin (4e).
appId: app.nuddle.debug
---
- extendedWaitUntil:
    visible:
      id: photo.screen
    timeout: 30000
- tapOn:
    id: photo.shoot
- extendedWaitUntil:
    visible:
      id: photo.send
    timeout: 15000
- tapOn:
    id: photo.send
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- assertVisible:
    id: home.nextUp
