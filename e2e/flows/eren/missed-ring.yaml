# After a force stop: the bell (2g) shows "Son dürtmen çalmadı", "Düzelt" opens the brand steps (2h). The emulator is
# no known brand, so the default step is shown.
appId: app.nuddle.debug
---
- launchApp
- extendedWaitUntil:
    visible:
      id: bar.bell
    timeout: 30000
- tapOn:
    id: bar.bell
- extendedWaitUntil:
    visible:
      id: inbox.missedRing
    timeout: 15000
- assertVisible: "Son dürtmen çalmadı"
- tapOn:
    id: inbox.missedRing.fix
- extendedWaitUntil:
    visible:
      id: missedRing.screen
    timeout: 15000
- extendedWaitUntil:
    visible: "Pil kullanımı: Kısıtlanmamış"
    timeout: 15000
- assertVisible:
    id: missedRing.open
