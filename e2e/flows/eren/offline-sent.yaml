# The connection is back (6a): the banner goes, the queued text goes out by itself and its task is on home.
appId: app.nuddle.debug
---
- extendedWaitUntil:
    notVisible:
      id: home.offline
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: home.queued
    timeout: 30000
- extendedWaitUntil:
    visible: "Para çek"
    timeout: 30000
