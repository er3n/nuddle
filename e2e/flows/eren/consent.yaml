# Right after sign-up the first sync brings Selin's invite and the consent screen (0f) opens by itself.
# İzin ver, the matched screen (0g), Başla: all permissions are granted on install, so setup is skipped
# and home follows.
appId: app.nuddle.debug
---
- extendedWaitUntil:
    visible:
      id: consent.screen
    timeout: 60000
- tapOn:
    id: consent.allow
- extendedWaitUntil:
    visible:
      id: matched.screen
    timeout: 30000
- tapOn:
    id: matched.start
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 30000
