# The full screen poke rang (3b). "Bugün yapamayacağım" opens the note sheet (7f) over it; "Yarın hallederim",
# then "Notla gönder", and the poke screen closes.
appId: app.nuddle.debug
---
- tapOn:
    id: poke.cantToday
- extendedWaitUntil:
    visible:
      id: drop.reason.Tomorrow
    timeout: 15000
- tapOn:
    id: drop.reason.Tomorrow
- tapOn:
    id: sheet.primary
- extendedWaitUntil:
    notVisible:
      id: poke.screen
    timeout: 15000
