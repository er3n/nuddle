# No network (6a): the banner under the top bar, and a text written now waits on the phone as "Sırada".
# TEXT comes from the orchestrator.
appId: app.nuddle.debug
---
- launchApp
- extendedWaitUntil:
    visible:
      id: home.offline
    timeout: 30000
- tapOn:
    id: compose.input
- inputText: ${TEXT}
- tapOn:
    id: compose.send
# The row reads "<text>, bağlantı gelince gidecek, Sırada" as one description (TaskRow), so it is found by its tag.
- extendedWaitUntil:
    visible:
      id: home.queued
    timeout: 30000
