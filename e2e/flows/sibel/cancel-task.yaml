# Sibel opens the task she sent (7c), Görevi iptal et, "Ben hallettim", İptal et (7d). The detail
# closes and the row leaves "Senin yazdıkların".
appId: app.nuddle.debug
---
- extendedWaitUntil:
    notVisible:
      id: home.undo
    timeout: 30000
- tapOn:
    id: home.sent
- extendedWaitUntil:
    visible:
      id: task.screen
    timeout: 15000
- tapOn:
    id: task.cancel
- tapOn:
    id: task.cancelReason.HandledIt
- tapOn:
    id: sheet.primary
- extendedWaitUntil:
    visible:
      id: home.screen
    timeout: 15000
- assertNotVisible:
    id: home.sent
