# Sign up with a test number on a fresh install: welcome (0a), phone (0c), code (0d), name (0e), home (1a).
# Elements are found only by test tag (apps/android ui/TestTags.kt). PHONE is the ten national digits.
# DONE is the screen that ends sign-up: home, or the consent screen (0f) when an invite waits.
# PHONE, NAME and DONE come from the orchestrator: a flow's own env values win over `-e` (found when
# Eren's phone signed in as Sibel), so they have no defaults here.
appId: app.nuddle.debug
env:
  CODE: "123456"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcome.start
    timeout: 30000
- tapOn:
    id: welcome.start
- tapOn:
    id: phone.input
- inputText: ${PHONE}
- hideKeyboard
- tapOn:
    id: phone.send
- extendedWaitUntil:
    visible:
      id: code.input
    timeout: 30000
- tapOn:
    id: code.input
- inputText: ${CODE}
- extendedWaitUntil:
    visible:
      id: name.input
    timeout: 30000
- tapOn:
    id: name.input
- inputText: ${NAME}
- hideKeyboard
- tapOn:
    id: name.continue
- extendedWaitUntil:
    visible:
      id: ${DONE}
    timeout: 60000
