# Tap the mic (4h, NUD-48): the injected speech is heard and goes into the box, the send arrow writes it, the task is
# created (undo toast).
appId: app.nuddle.debug
---
- launchApp
- extendedWaitUntil:
    visible:
      id: compose.mic
    timeout: 30000
- tapOn:
    id: compose.mic
- extendedWaitUntil:
    visible:
      id: compose.send
    timeout: 30000
- tapOn:
    id: compose.send
- extendedWaitUntil:
    visible:
      id: home.undo
    timeout: 30000
