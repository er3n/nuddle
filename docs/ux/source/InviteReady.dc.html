<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Davet et, hazır</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C23A06}a:hover{color:#8F2A03}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; background: #F2F4F6; color: #11151A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px">
<a href="InviteCreate.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #11151A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Birini davet et</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600">Kimi?</div>
<div style="background: #FFFFFF; border: 2px solid #11151A; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #C83C08; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px">S</div>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600; font-size: 16px">Sibel</div><div style="font-size: 13px; color: #4D5763">+90 532 987 65 43</div></div>
<button style="flex: none; height: 40px; padding: 0 12px; border: 1px solid #C9D0D7; border-radius: 12px; background: #FFFFFF; color: #11151A; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13px">Değiştir</button>
</div>
<div style="font-size: 12px; color: #5A6470">Rehberden tek bir kişi seçtin. Rehberinin geri kalanına erişmiyoruz.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600">Sibel senin neyin?</div>
<div role="radiogroup" aria-label="İlişki" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ roles }}" as="r" hint-placeholder-count="6">
<button role="radio" aria-checked="{{ r.checked }}" style="height: 42px; padding: 0 16px; border-radius: 999px; border: {{ r.border }}; background: {{ r.bg }}; color: {{ r.fg }}; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 14px">{{ r.label }}</button>
</sc-for>
</div>
<div style="background: #FFFFFF; border: 1px solid #DDE2E7; border-radius: 14px; padding: 12px 14px; font-size: 13px; line-height: 1.45; color: #3B4550">Birbirinize görev yazabileceksiniz. Sibel'in eşin olduğunu bilmek, kime ne zaman haber vereceğime karar verirken işime yarar.</div>
</div>

<div style="flex: 1"></div>
<a href="HomeInviteSent.dc.html" style="height: 58px; border: 0; border-radius: 18px; background: #FF5A1F; color: #11151A; font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">Daveti gönder</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var labels = ["Eşim", "Annem / Babam", "Çocuğum", "Kardeşim", "Ev arkadaşım", "Diğer"];
return {
roles: labels.map(function (l, i) {
var on = i === 0;
return { label: l, checked: on ? "true" : "false", bg: on ? "#11151A" : "#FFFFFF", fg: on ? "#FFFFFF" : "#11151A", border: on ? "1.5px solid #11151A" : "1.5px solid #C9D0D7" };
})
};
}
}
</script>
</body>
</html>
