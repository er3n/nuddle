<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kod</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C23A06}a:hover{color:#8F2A03}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; background: #F2F4F6; color: #11151A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
<button aria-label="Geri" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; color: #11151A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em">WhatsApp'ına baktın mı?</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #4D5763">+90 532 123 45 67 numarasına 6 haneli kod gönderdik. <a href="Phone.dc.html">Numarayı değiştir</a></p>
</div>
<div role="group" aria-label="Doğrulama kodu" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ digits }}" as="d" hint-placeholder-count="6">
<input type="text" inputmode="numeric" maxlength="1" aria-label="{{ d.label }}" value="{{ d.v }}" style="height: 64px; width: 100%; box-sizing: border-box; text-align: center; border: {{ d.border }}; border-radius: 14px; background: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px; color: #11151A; outline: none">
</sc-for>
</div>
<div style="font-size: 14px; color: #4D5763">Kod gelmedi mi? <span style="font-weight: 600; color: #11151A">0:42</span> sonra tekrar gönderebilirsin.</div>
<div style="background: #FFFFFF; border: 1px solid #DDE2E7; border-radius: 16px; padding: 14px 16px; font-size: 13px; line-height: 1.45; color: #3B4550">Kod WhatsApp'a gelince klavyenin üstünde otomatik çıkar, dokunman yeter.</div>
<div style="flex: 1"></div>
<button style="height: 48px; border: 1.5px solid #11151A; border-radius: 16px; background: transparent; color: #11151A; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px">SMS ile dene</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var vals = ["4", "8", "1", "", "", ""];
return {
digits: vals.map(function (v, i) {
return { v: v, label: (i + 1) + ". hane", border: i === 3 ? "2px solid #11151A" : (v ? "1.5px solid #8A96A3" : "1.5px solid #C9D0D7") };
})
};
}
}
</script>
</body>
</html>
