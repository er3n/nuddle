<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>İsim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C23A06}a:hover{color:#8F2A03}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 28px; background: #F2F4F6; color: #11151A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
<div style="height: 44px"></div>
<div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em">Sana ne diyelim?</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #4D5763">Eşleştiğin kişiler seni bu isimle görür, görevlerde de bu isimle anılırsın.</p>
</div>
<div style="display: flex; justify-content: center">
<button aria-label="Fotoğraf ekle" style="position: relative; width: 112px; height: 112px; border-radius: 56px; border: 0; background: #11151A; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px; display: flex; align-items: center; justify-content: center">{{ initial }}
<span style="position: absolute; right: 0; bottom: 4px; width: 36px; height: 36px; border-radius: 18px; background: #FF5A1F; color: #11151A; border: 3px solid #F2F4F6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="name" style="font-size: 13px; font-weight: 600">Adın</label>
<input id="name" type="text" value="{{ nameVal }}" placeholder="Adın" style="height: 60px; box-sizing: border-box; border: 2px solid #11151A; border-radius: 16px; padding: 0 16px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; color: #11151A; background: #FFFFFF; outline: none">
<sc-if value="{{ davetli }}" hint-placeholder-val="{{ true }}">
<div style="font-size: 13px; color: #4D5763">Selin seni "Eren" diye eklemişti. Değiştirebilirsin.</div>
</sc-if>
</div>
<div style="flex: 1"></div>
<div style="font-size: 12px; color: #5A6470; text-align: center">Fotoğraf isteğe bağlı. Yoksa baş harfin görünür.</div>
<a href="Home.dc.html" style="height: 58px; border: 0; border-radius: 18px; background: #11151A; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">Devam</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"davetli":{"editor":"boolean","default":true,"section":"Varyant"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var d = this.props.davetli ?? true;
return { davetli: d, nameVal: d ? "Eren" : "", initial: d ? "E" : "?" };
}
}
</script>
</body>
</html>
