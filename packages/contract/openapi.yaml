paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Deployment version and database connectivity
      tags:
        - health
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is down, or missing where it is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/auth/otp:
    post:
      operationId: sendOtp
      summary: Send a one-time code to the phone (sign-up and sign-in are one flow)
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/verify:
    post:
      operationId: verifyOtp
      summary: Exchange the code for a session
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Exchange a refresh token for a new session
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Error with a DRT code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/sync:
    get:
      operationId: sync
      summary: Everything that changed for the caller since the cursor (ADR 0006)
      tags:
        - sync
      security:
        - bearer: []
      parameters:
        - schema:
            type: string
            pattern: ^\d+$
            description: Omit for a full sync
          required: false
          description: Omit for a full sync
          name: cursor
          in: query
        - schema:
            type: string
            format: uuid
            description: Marks the device as seen online
          required: false
          description: Marks the device as seen online
          name: deviceId
          in: query
      responses:
