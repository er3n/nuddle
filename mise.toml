# Tool versions and the tasks every human, agent and CI job uses (ADR 0001).
# CLAUDE.md lists these tasks; nothing else should need pnpm filters or Gradle task names.

[tools]
node = "22.23.3"
pnpm = "10.34.6"
java = "temurin-21.0.12+101.0.LTS"
supabase = "2.120.0"
maestro = "cli-2.10.0"
gitleaks = "8.30.1"
"github:sbdchd/squawk" = "2.68.0"

[env]
NEXT_TELEMETRY_DISABLED = "1"
REDOCLY_TELEMETRY = "off"
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"
# Local-only shared secrets for the internal endpoints (tick, Send SMS hook). Not secrets: the
# local stack is not reachable from outside. The cloud values live in Vercel and Supabase env
# (docs/human-checklist.md, Before stage 7).
TICK_SECRET = "local-tick-secret-for-development-only"
SEND_SMS_HOOK_SECRET = "v1,whsec_bG9jYWwtc2VuZC1zbXMtaG9vay1zZWNyZXQ="
# Android SDK: an existing ANDROID_HOME wins (CI runners set it); otherwise the Android Studio default on macOS.
ANDROID_HOME = "{{ env.ANDROID_HOME | default(value=env.HOME ~ '/Library/Android/sdk') }}"

# ---------------------------------------------------------------------------
# Internal

[tasks._install]
description = "Install pnpm dependencies when the lockfile or a manifest changed"
hide = true
sources = ["pnpm-lock.yaml", "package.json", "pnpm-workspace.yaml", "apps/*/package.json", "e2e/orchestrator/package.json"]
outputs = ["node_modules/.pnpm/lock.yaml"]
run = "pnpm install --frozen-lockfile"

[tasks."lint:eslint"]
hide = true
depends = ["_install"]
run = "pnpm exec eslint . --max-warnings=0 --cache --cache-location node_modules/.cache/eslint/"

[tasks."lint:typecheck"]
hide = true
depends = ["_install"]
run = "pnpm --filter @nuddle/web typecheck"

[tasks."lint:typecheck:e2e"]
hide = true
# Only in `lint`, not in test:fast: next to the CPU-bound planPokes property test it starves it on
# small CI runners (timed out on the first stage 6 CI run).
depends = ["_install"]
run = "pnpm --filter @nuddle/e2e typecheck"

[tasks."lint:format"]
hide = true
depends = ["_install"]
run = "pnpm exec prettier --check ."

[tasks."lint:deps"]
hide = true
depends = ["_install"]
run = "pnpm exec depcruise apps/web/src --config .dependency-cruiser.cjs"

[tasks."lint:knip"]
hide = true
depends = ["_install"]
run = "pnpm exec knip"

[tasks."lint:migrations"]
hide = true
# Safe-migration rules (docs/quality.md); config in .squawk.toml.
run = "squawk supabase/migrations/*.sql"

[tasks."lint:contract"]
hide = true
# operationId on every operation, consistent naming (ADR 0008); config in redocly.yaml.
depends = ["_install"]
run = "pnpm --filter @nuddle/web contract:lint"

[tasks."lint:android"]
hide = true
# ktlint (Spotless), detekt with the Compose rules, Android Lint (docs/quality.md, Kotlin).
dir = "apps/android"
run = "./gradlew --console=plain spotlessCheck :app:detekt :app:lintDevDebug"

[tasks."lint:secrets"]
hide = true
# Scan only the history reachable from HEAD; by default gitleaks scans every ref (--all).
run = "gitleaks git --redact --verbose --no-banner --log-opts=HEAD ."

# ---------------------------------------------------------------------------
# Public tasks (listed in CLAUDE.md)

[tasks.fix]
description = "Run all formatters and autofixers"
depends = ["_install"]
run = [
  "pnpm exec prettier --write --log-level=warn .",
  "pnpm exec eslint . --fix --cache --cache-location node_modules/.cache/eslint/",
  "cd apps/android && ./gradlew --console=plain --quiet spotlessApply",
]

[tasks.lint]
description = "All lint and static checks"
depends = [
  "lint:format",
  "lint:eslint",
  "lint:typecheck",
  "lint:typecheck:e2e",
  "lint:deps",
  "lint:knip",
  "lint:migrations",
  "lint:contract",
  "lint:android",
  "lint:secrets",
]

[tasks."test:unit"]
hide = true
depends = ["_install"]
run = "pnpm --filter @nuddle/web test:unit"

[tasks."android:test"]
description = "Android unit, UI, accessibility, Konsist and screenshot tests (Robolectric)"
# Roborazzi is in record-only mode (docs/testing.md, Android UI tests): images go to
# apps/android/app/screenshots, nothing is compared yet.
dir = "apps/android"
run = "./gradlew --console=plain :app:testDevDebugUnitTest -Proborazzi.test.record=true"

[tasks."test:fast"]
description = "Fast loop after every change (target under a minute)"
depends = ["lint:eslint", "lint:typecheck", "test:unit"]
# After the CPU-bound server unit tests, not next to them: Gradle starves them on small runners.
run = "mise run android:test"

[tasks."test:scenario"]
hide = true
# Simulated phones against the HTTP API and a per-test Postgres database; needs local Supabase.
depends = ["_install"]
run = "pnpm --filter @nuddle/web test:scenario"

[tasks."test:http"]
hide = true
# Hono app.request() against a per-run Postgres database; needs local Supabase.
depends = ["_install"]
run = "pnpm --filter @nuddle/web test:http"

[tasks."contract:check"]
hide = true
# Fails when the committed contract differs from the zod schemas (ADR 0008).
depends = ["contract:gen"]
run = [
  "git diff --exit-code -- packages/contract/openapi.yaml packages/contract/openapi.d.ts",
  "test -z \"$(git status --porcelain -- packages/contract/openapi.yaml packages/contract/openapi.d.ts)\" || { echo 'contract files are not committed'; exit 1; }",
]

[tasks."test:integration"]
hide = true
# Needs the local Supabase stack (`supabase start` or `mise run dev`); fails, never skips, without it.
depends = ["_install"]
run = "pnpm --filter @nuddle/web test:integration"

[tasks.test]
description = "Full suite before a PR"
depends = ["test:fast"]
# After test:fast and one at a time: run in parallel, the database suites starve the CPU-bound
# planPokes property test on small CI runners (it timed out on the first stage 4 CI run).
run = [
  "mise run contract:check",
  "mise run test:http",
  "mise run test:scenario",
  "mise run test:integration",
]

[tasks."db:up"]
hide = true
description = "Start local Supabase if needed, then rebuild the database from migrations and seed"
run = [
  "supabase status >/dev/null 2>&1 || supabase start",
  "supabase db reset",
]

[tasks.dev]
description = "Start local Supabase, apply migrations and seed, start the web app"
depends = ["_install", "db:up"]
# Local Supabase URLs and keys come from `supabase status`; OPENROUTER_* from apps/web/.env.local.
run = """
eval "$(supabase status -o env | sed -n -e 's/^API_URL=/export SUPABASE_URL=/p' -e 's/^SECRET_KEY=/export SUPABASE_SECRET_KEY=/p' -e 's/^DB_URL=/export DATABASE_URL=/p')"
pnpm --filter @nuddle/web dev
"""

[tasks."e2e:smoke"]
description = "Two-emulator smoke set before merging"
# Foreground with a 20 minute hard timeout; prints the run folder (e2e-runs/<timestamp>/) first and
# last. Long: agents start it in the background and poll <run folder>/orchestrator.log (CLAUDE.md).
# Needs FIREBASE_SERVICE_ACCOUNT in apps/web/.env.local and :3000 free (e2e/README.md).
depends = ["_install"]
run = "pnpm --filter @nuddle/e2e smoke"

[tasks."e2e:emulators"]
hide = true
description = "Create and boot the two E2E emulators headless (emulator-5554 Selin, emulator-5556 Eren)"
run = "e2e/scripts/emulators.sh boot"

[tasks."e2e:emulators:stop"]
hide = true
description = "Shut down the two E2E emulators"
run = "e2e/scripts/emulators.sh stop"

[tasks.tick]
description = "Run server timers once locally"
# Calls the running `mise run dev` server the way pg_cron does in the cloud (ADR 0007).
run = "curl -fsS -X POST -H \"Authorization: Bearer $TICK_SECRET\" http://localhost:3000/api/internal/tick && echo"

[tasks."contract:gen"]
description = "Regenerate packages/contract/openapi.yaml"
depends = ["_install"]
run = "pnpm --filter @nuddle/web contract:gen"

[tasks.eval]
description = "LLM extraction golden set (needs an API key)"
# OPENROUTER_API_KEY and OPENROUTER_MODEL from the environment or apps/web/.env.local.
depends = ["_install"]
run = "pnpm --filter @nuddle/web eval"
